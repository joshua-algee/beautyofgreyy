<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Session | Beautyofgreyy Photography</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="sub-hero">

  <nav class="navbar">
    <div class="logo">Beautyofgreyy Photography</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="booking.html">Book Now</a>
    </div>
  </nav>

  <div class="sub-hero-content">
    <h1>Booking</h1>
  </div>

</header>

<main>

<section class="section booking">

  <p class="section-label">Booking</p>

  <h2>Want to set up a shoot?</h2>

  <p>
    Fill out the request form below.
  </p>

  <br><br>

  <form class="booking-form">

    <input type="text" placeholder="Full Name">

    <input type="tel" placeholder="Phone">

    <input type="text" placeholder="Type of Shoot">

    <input type="text" placeholder="Location">

    <input type="text" placeholder="Possible Booking Dates">

    <textarea placeholder="Other Details or Questions"></textarea>

    <button type="submit" class="button">
      Book
    </button>

  </form>

</section>

</main>

<footer>
  <p>© 2026 Beautyofgreyy Photography</p>
</footer>
